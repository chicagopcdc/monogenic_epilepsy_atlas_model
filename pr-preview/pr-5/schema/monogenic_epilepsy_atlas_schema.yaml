slots:
  id:
    name: id
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/id
    description: A unique identifier for a thing
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: Thing
    domain_of:
    - Thing
    range: uriorcurie
    required: true
  identity:
    name: identity
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/identity
    description: A unique identifier for a thing that has carries meaning outside
      of the context of this schema or a particular instance of this schema.  For
      example, a concept in an ontology may have a URI that is used to identify it
      in the context of that ontology, and that URI may be used to identify the concept
      in other contexts as well.  In contrast, the id slot is intended to be a unique
      identifier for a thing within the context of this schema or a particular instance
      of this schema.
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    owner: NamedThing
    domain_of:
    - NamedThing
    range: uriorcurie
    multivalued: true
  name:
    name: name
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/name
    description: A human-readable name for a thing
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  aliases:
    name: aliases
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/aliases
    description: An alternative human-readable name for a thing
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    mappings:
    - schema:alternateName
    slot_uri: schema:alternateName
    owner: Organization
    domain_of:
    - Condition
    - Gene
    - Organization
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/description
    description: A human-readable description for a thing
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  primary_email:
    name: primary_email
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/primary_email
    description: The main email address of a person
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    mappings:
    - schema:email
    slot_uri: schema:email
    owner: Person
    domain_of:
    - Person
    range: string
  link:
    name: link
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/link
    description: A link to a web resource that provides more information about a thing
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    mappings:
    - schema:url
    slot_uri: schema:url
    owner: ExternalReference
    domain_of:
    - ExternalReference
    range: uriorcurie
  external_references:
    name: external_references
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/external_references
    description: A list of external references that provide more information about
      a thing
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:external_references
    owner: Organization
    domain_of:
    - Condition
    - Gene
    - Organization
    range: ExternalReference
    multivalued: true
  reports_seizures:
    name: reports_seizures
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/reports_seizures
    description: A flag indicating whether a condition is associated with seizures
      or epilepsy
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:reports_seizures
    owner: Condition
    domain_of:
    - Condition
    range: YesNoUnknown
  found_in_corpus:
    name: found_in_corpus
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/found_in_corpus
    description: A flag indicating whether a Gene or Condition is found in the corpus
      of monogenic epilepsy disorders
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:found_in_corpus
    owner: Gene
    domain_of:
    - Condition
    - Gene
    range: YesNoUnknown
  num_pages_in_corpus:
    name: num_pages_in_corpus
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/num_pages_in_corpus
    description: The number of pages in the corpus of monogenic epilepsy disorders
      that mention this Gene or Condition
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:num_pages_in_corpus
    owner: Gene
    domain_of:
    - Condition
    - Gene
    range: integer
  pathophysiologic_mechanism:
    name: pathophysiologic_mechanism
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/pathophysiologic_mechanism
    description: A description of the pathophysiologic mechanism of a Gene or Condition,
      if known.  For example, a gene may be associated with a condition because it
      is involved in a particular biological pathway that is disrupted in the condition.  In
      this case, the pathophysiologic mechanism would be the biological pathway that
      is disrupted.
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:pathophysiologic_mechanism
    owner: Gene
    domain_of:
    - Gene
    range: string
  genes4epilepsy_listed:
    name: genes4epilepsy_listed
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/genes4epilepsy_listed
    description: A flag indicating whether a Gene is listed in the Genes4Epilepsy
      database
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:genes4epilepsy_listed
    owner: Gene
    domain_of:
    - Gene
    range: YesNoUnknown
  causes_condition:
    name: causes_condition
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/causes_condition
    description: A list of conditions that are caused by a Gene
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:causes_condition
    owner: Gene
    domain_of:
    - Gene
    range: Condition
  organization_type:
    name: organization_type
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/organization_type
    description: The type of organization.  For example, a research organization,
      a patient advocacy organization, or a professional society.
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:organization_type
    owner: Organization
    domain_of:
    - Organization
    range: OrganizationType
  primary_location:
    name: primary_location
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/primary_location
    description: The location of an organization.  For example, a state and/or country.
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:primary_location
    owner: Organization
    domain_of:
    - Organization
    range: Location
  state:
    name: state
    definition_uri: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema/state
    description: The state or province where an organization is located
    from_schema: https://w3id.org/chicagopcdc/monogenic-epilepsy-atlas-schema
    slot_uri: monogenic_epilepsy_atlas_schema:state
    owner: Location
    domain_of:
    - Location
    range: UsaState
  country:
    name: country
