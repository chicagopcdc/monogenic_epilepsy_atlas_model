---
id: https://w3id.org/bfurner/monogenic-epilepsy-atlas-schema
name: monogenic-epilepsy-atlas-schema
title: Monogenic Epilepsy Atlas Schema
description: |-
  This is the LinkML schema for the Monogenic Epilepsy Atlas schema
license: Apache-2.0
see_also:
  - https://bfurner.github.io/monogenic-epilepsy-atlas-schema

prefixes:
  monogenic_epilepsy_atlas_schema: https://w3id.org/bfurner/monogenic-epilepsy-atlas-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: monogenic_epilepsy_atlas_schema
default_range: string

imports:
  - linkml:types

classes:
  Thing:
    description: >-
      A generic grouping for any identifiable entity
    slots:
      - id
    class_uri: schema:Thing
    slot_usage:
      id:
        required: true
      identity:
        required: false

  NamedThing:
    is_a: Thing
    description: >-
      A generic grouping for any named identifiable entity
    slots:
      - identity
      - name
      - description
    class_uri: schema:Thing
    slot_usage:
      identity:
        required: false
      name:
        required: true
      description:
        required: false

  GeneCollection:
    tree_root: true
    description: >-
      A holder for Gene objects
    attributes:
      genes:
        range: Gene
        multivalued: true
        inlined_as_list: true

  Condition:
    description: >-
      A condition is a disease or disorder that is associated with a person.  It may be
      a monogenic disorder, or it may be a complex disorder that is associated with a
      monogenic disorder.
    is_a: NamedThing
    slots:
      - aliases
      - external_references
      - reports_seizures
      - found_in_corpus
      - num_pages_in_corpus
      - in_scope
    slot_usage:
      aliases:
        multivalued: true
        required: false
      external_references:
        multivalued: true
        required: false
      reports_seizures:
        multivalued: false
        required: true
      found_in_corpus:
        multivalued: false
        required: true
      num_pages_in_corpus:
        multivalued: false
        required: false
      in_scope:
        multivalued: false
        required: true

  Gene:
    description: >-
      A gene is a segment of DNA that is associated with a condition.  It may be a
      monogenic gene, or it may be a gene that is associated with a monogenic gene.
    is_a: NamedThing
    slots:
      - aliases
      - external_references
      - found_in_corpus
      - num_pages_in_corpus
      - pathophysiologic_mechanism
      - genes4epilepsy_listed
      - causes_condition
      - in_scope
    slot_usage:
      aliases:
        multivalued: true
        required: false
      external_references:
        multivalued: true
        required: false
      found_in_corpus:
        multivalued: false
        required: true
      num_pages_in_corpus:
        multivalued: false
        required: false
      pathophysiologic_mechanism:
        multivalued: false
        required: false
      genes4epilepsy_listed:
        multivalued: false
        required: true
      causes_condition:
        multivalued: true
        required: false
      in_scope:
        multivalued: false
        required: true

  Organization:
    description: >-
      An organization is a group of people that is associated with a condition or gene.
      It may be a research organization, a patient advocacy organization, or a
      professional society.
    is_a: NamedThing
    slots:
      - aliases
      - external_references
      - organization_type
      - primary_location
      - reach
      - year_founded
      - in_scope
      - leader
      - contact_person
      - contact_urls
      - logo
      - has_registry_or_study
      - is_czi_rao_grantee
      - czi_rao_cohort_year
      - advocates_for_condition
      - advocates_for_gene
      - member_of_organization
    slot_usage:
      aliases:
        multivalued: true
        required: false
      external_references:
        multivalued: true
        required: false
      organization_type:
        multivalued: false
        required: true
      primary_location:
        multivalued: false
        required: false
      reach:
        multivalued: false
        required: false
      year_founded:
        multivalued: false
        required: false
      in_scope:
        multivalued: false
        required: true
      leader:
        multivalued: false
        required: false
      contact_person:
        multivalued: false
        required: false
      contact_urls:
        multivalued: true
        required: false
      logo:
        multivalued: false
        required: false
      has_registry_or_study:
        multivalued: false
        required: true
      is_czi_rao_grantee:
        multivalued: false
        required: false
      czi_rao_cohort_year:
        multivalued: false
        required: false
      advocates_for_condition:
        multivalued: true
        required: false
      advocates_for_gene:
        multivalued: true
        required: false
      member_of_organization:
        multivalued: true
        required: false

  ExternalReference:
    description: >-
      An external reference is a reference to an entity in an external resource.  It
      may be a reference to a concept in an ontology, or it may be a reference to a
      record in a database.
    is_a: NamedThing
    slots:
      - link
    slot_usage:
      link:
        required: true

  Location:
    description: >-
      A location is a physical place where an organization is located.  It may be a
      state and/or country.
    is_a: NamedThing
    slots:
      - state
      - country
    slot_usage:
      state:
        multivalued: false
        required: false
      country:
        multivalued: false
        required: true

  Person:
    description: >-
      A person is an individual who is associated with an organization, condition or gene.  It may be
      a researcher, a patient, or a caregiver.
    is_a: NamedThing
    slots:
      - primary_email
      - professional_title
    slot_usage:
      primary_email:
        multivalued: false
        required: false
      professional_title:
        multivalued: false
        required: false

slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing
  identity:
    slot_uri: schema:identifier
    range: uriorcurie
    multivalued: true
    description: A unique identifier for a thing that has carries meaning outside of the context of this schema or a particular instance of this schema.  For example, a concept in an ontology may have a URI that is used to identify it in the context of that ontology, and that URI may be used to identify the concept in other contexts as well.  In contrast, the id slot is intended to be a unique identifier for a thing within the context of this schema or a particular instance of this schema.
  name:
    slot_uri: schema:name
    range: string
    description: A human-readable name for a thing
  aliases:
    slot_uri: schema:alternateName
    range: string
    description: An alternative human-readable name for a thing
  description:
    slot_uri: schema:description
    range: string
    description: A human-readable description for a thing
  primary_email:
    slot_uri: schema:email
    range: string
    description: The main email address of a person
  link:
    slot_uri: schema:url
    range: uriorcurie
    description: A link to a web resource that provides more information about a thing
  external_references:
    range: ExternalReference
    multivalued: true
    description: A list of external references that provide more information about a thing
  reports_seizures:
    range: YesNoUnknown
    description: A flag indicating whether a condition is associated with seizures or epilepsy
  found_in_corpus:
    range: YesNoUnknown
    description: A flag indicating whether a Gene or Condition is found in the corpus of monogenic epilepsy disorders
  num_pages_in_corpus:
    range: integer
    description: The number of pages in the corpus of monogenic epilepsy disorders that mention this Gene or Condition
  pathophysiologic_mechanism:
    range: string
    description: A description of the pathophysiologic mechanism of a Gene or Condition, if known.  For example, a gene may be associated with a condition because it is involved in a particular biological pathway that is disrupted in the condition.  In this case, the pathophysiologic mechanism would be the biological pathway that is disrupted.
  genes4epilepsy_listed:
    range: YesNoUnknown
    description: A flag indicating whether a Gene is listed in the Genes4Epilepsy database
  causes_condition:
    range: Condition
    description: A list of conditions that are caused by a Gene
  organization_type:
    range: OrganizationType
    description: The type of organization.  For example, a research organization, a patient advocacy organization, or a professional society.
  primary_location:
    range: Location
    description: The location of an organization.  For example, a state and/or country.
  state:
    range: UsaState
    description: The state or province where an organization is located
  country:
    range: Country
    description: The country where an organization is located
  reach:
    range: Reach
    description: The reach of an organization.  For example, a patient advocacy organization may have a regional, national, or international reach.
  year_founded:
    range: integer
    description: The year an organization was founded
  in_scope:
    range: YesNoUnknown
    description: A flag indicating whether a Gene, Condition, or Organization is in scope for the Monogenic Epilepsy Atlas project
  professional_title:
    range: string
    description: The professional title of a person.  For example, a researcher may have the title of "Professor" or "Research Scientist".
  leader:
    range: Person
    description: The leader of an organization.  For example, the president of a professional society or the director of a research organization.
  contact_person:
    range: Person
    description: The contact person for an organization.  For example, the person who is responsible for managing the organization's website or social media accounts.
  contact_urls:
    range: uriorcurie
    description: A link to a web resource that provides more information about how to get in contact with an organization
  logo:
    range: uriorcurie
    description: A link to a web resource that provides a logo for an organization
  has_registry_or_study:
    range: YesNoUnknown
    description: A flag indicating whether an organization has a registry or study for a condition or gene
  is_czi_rao_grantee:
    range: YesNoUnknown
    description: A flag indicating whether an organization is a grantee of the CZI Rare as One program
  czi_rao_cohort_year:
    range: integer
    description: The year an organization was a grantee of the CZI Rare as One program
  advocates_for_condition:
    range: Condition
    description: A list of conditions that an organization advocates for.  For example, a patient advocacy organization may advocate for a particular condition or set of conditions.
  advocates_for_gene:
    range: Gene
    description: A list of genes that an organization advocates for.  For example, a patient advocacy organization may advocate for a particular gene or set of genes.
  member_of_organization:
    range: Organization
    description: An organization that a given organization is a member of.  For example, a patient advocacy organization may be a member of a larger umbrella organization.

enums:
  YesNoUnknown:
    description: A simple enumeration for yes, no, or unknown
    permissible_values:
      YES:
        description: yes
      NO:
        description: no
      UNKNOWN:
        description: unknown
  OrganizationType:
    description: A simple enumeration for the type of organization
    permissible_values:
      CHAPTER:
        description: A chapter (e.g., regional)
      CONSORTIUM:
        description: A consortium or umbrella organization
      INFORMAL_COMMUNITY:
        description: An informal community (e.g., a Facebook group)
      PATIENT_ADVOCACY:
        description: A patient advocacy organization
  UsaState:
    description: A simple enumeration for the US states
    permissible_values:
      AL:
        description: Alabama
      AK:
        description: Alaska
      AZ:
        description: Arizona
      AR:
        description: Arkansas
      CA:
        description: California
      CO:
